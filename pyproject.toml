# Tooling configuration for ruff (lint) and mypy (type check).
# There is no build/packaging section yet — installation is still
# `git clone` + `python3 main.py` (see CLAUDE.md "Known gaps").

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Keep ruff's default rule set. Since 0.16 that is considerably more than
# pyflakes + pycodestyle errors (isort, bugbear, simplify, pyupgrade, ...), which
# is why the version is pinned in requirements-dev.txt.
# E402 is ignored project-wide: PyGObject requires `gi.require_version(...)`
# calls before `from gi.repository import ...`, which legitimately puts imports
# after executable statements in many modules.
extend-ignore = ["E402"]

[tool.ruff.lint.isort]
# `gi_versions` pins the GObject-Introspection versions and must be imported
# before anything from `gi.repository`. As first-party code it would sort
# *after* the third-party `gi` import and silently undo the pinning, so it gets
# a section of its own ahead of third-party.
sections = { "gi-pinning" = ["gi_versions"] }
section-order = ["future", "standard-library", "gi-pinning", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.per-file-ignores]
# Packages re-export their public API through __init__, so unused-import is
# expected there.
"__init__.py" = ["F401"]
# Best-effort widget calls (focus, scroll position, CSS classes, style schemes)
# whose failure must never abort the UI flow that triggered them; there is
# nothing useful to log either. Kept per file so new code elsewhere is still
# checked.
"focus_guard.py" = ["BLE001", "S110"]
"detail_page/{assets,layout,options}.py" = ["BLE001", "S110"]

[tool.mypy]
python_version = "3.11"
# This is a large, historically untyped GTK/PyGObject codebase. Keep mypy
# lenient about stubs so it surfaces real errors instead of drowning in
# missing-stub noise -- but do check the bodies of untyped functions, which is
# where the actual type errors live in a codebase with few annotations.
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = false
check_untyped_defs = true
# Test modules stub `logger_setup` by injecting a dummy module into sys.modules
# (see CLAUDE.md); mypy cannot model that pattern, so type-checking is scoped to
# the application code.
# build-dir/ and .flatpak-builder/ are flatpak-builder scratch space: they
# contain a copy of the tree plus root-owned files mypy cannot even read.
exclude = ["^tests/", "^build-dir/", "^\\.flatpak-builder/"]

# The UI mixins are the one place where check_untyped_defs cannot work yet:
# every `MainWindow*Mixin` / `DetailPage*Mixin` reads attributes that only the
# composed class owns, which mypy reports as `attr-defined` (~880 findings, all
# of the same shape). Re-enable a module here once its mixin declares the
# attributes it consumes -- do not add new entries to this list.
[[tool.mypy.overrides]]
module = [
    "detail_page.assets",
    "detail_page.icon",
    "detail_page.layout",
    "detail_page.options",
    "detail_page.transfer",
    "mainwindow.dialogs",
    "mainwindow.entries",
    "mainwindow.launch_export",
    "mainwindow.notifications",
    "mainwindow.overview",
    "mainwindow.profile_import",
    "mainwindow.settings",
    "mainwindow.window_state",
]
check_untyped_defs = false
