name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test suite (GTK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The suite is pure unittest, but four test modules import the
      # `mainwindow` / `detail_page` packages, which pull in PyGObject.
      # Use the distribution's python3-gi instead of building PyGObject from
      # source -- it is the same way the app is meant to be run.
      - name: Install GTK 4 / Libadwaita bindings
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1 \
            python3-pil python3-coverage

      # cairosvg only gates SVG icon import, and the matching tests skip
      # themselves when it is absent -- so a missing package must not fail CI.
      - name: Install optional dependencies
        continue-on-error: true
        run: sudo apt-get install -y --no-install-recommends python3-cairosvg

      - name: Show interpreter version
        run: python3 --version

      - name: Run tests
        run: python3 -m coverage run -m unittest discover -s tests -v

      - name: Coverage report
        run: python3 -m coverage report --omit="tests/*"

  quality:
    name: Lint & types (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # ruff and mypy need no GTK: mypy runs with ignore_missing_imports,
      # so `gi` resolves to Any instead of erroring out.
      - name: Install tooling
        run: python -m pip install --upgrade ruff mypy

      - name: Byte-compile all modules
        run: python -m compileall -q .

      - name: ruff
        run: ruff check .

      - name: mypy
        run: mypy .
